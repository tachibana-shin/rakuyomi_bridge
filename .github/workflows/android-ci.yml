name: Android CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
    secrets:
      KEYSTORE_CONTENT:
        required: true
      KEYSTORE_ALIAS:
        required: true
      KEYSTORE_PASSWORD:
        required: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout bridge code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone RakuYomi
        uses: actions/checkout@v4
        with:
          repository: tachibana-shin/rakuyomi
          path: rakuyomi

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "rakuyomi -> backend -> target"
          prefix-key: "rust-cache"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
  
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          # bun.lock files use the v1 format (stable bun)
          bun-version: 1.3.14

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rakuyomi/backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rakuyomi/backend/Cargo.lock') }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK (r23b)
        run: sdkmanager "ndk;23.1.7779620"

      - name: Configure NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/23.1.7779620" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/23.1.7779620" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/ndk/23.1.7779620/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      - name: Install cargo-ndk
        run: cargo install cargo-ndk && rustup target install aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Build Rust Android libraries (dev mode)
        env:
          BRIDGE_DIR: ${{ github.workspace }}
        run: bash rakuyomi/scripts/build-rust-android.sh

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Write local.properties
        env:
          KEYSTORE_CONTENT: ${{ secrets.KEYSTORE_CONTENT }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_CONTENT" | base64 --decode > release.keystore
          SHA256=$(keytool -list -v -keystore release.keystore -alias "$KEYSTORE_ALIAS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep "SHA256: " | awk '{print $2}')
          echo "RELEASE_CERT_SHA256=$SHA256" >> local.properties
          rm release.keystore

      - name: Run Android Lint
        run: ./gradlew :androidApp:lintDebug

      - name: Run Unit Tests
        run: ./gradlew :androidApp:testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Run Headless Lint
        run: ./gradlew :androidHeadless:lintDebug

      - name: Build Headless Debug APK
        run: ./gradlew :androidHeadless:assembleDebug
